name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t puls-events-rag .

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name puls-events-rag-container puls-events-rag

      - name: Wait for API to be ready
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not start in time"
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop puls-events-rag-container || true
          docker rm puls-events-rag-container || true